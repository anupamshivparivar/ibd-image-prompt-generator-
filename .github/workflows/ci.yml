name: IBD Studio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Sacred Corpus Integrity (0 Corruptions)
        run: npm run check:corpus

      - name: Run TypeScript & Linter
        run: npm run lint

      - name: Verify Production Build
        run: npm run build
